<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Planillas Adicionales</title>
  
  <!-- Configuración PWA y Web App -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="theme-color" content="#00adb5">

  <!-- Estilos CSS -->
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent-color: #00adb5;
      --text-color: #eeeeee;
      --border-color: #333333;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background-color: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }

    h1, h2 {
      text-align: center;
      color: var(--accent-color);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    label {
      font-weight: bold;
      margin-bottom: 5px;
      display: block;
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      background-color: #2a2a2a;
      color: var(--text-color);
      box-sizing: border-box;
    }

    button {
      background-color: var(--accent-color);
      color: #fff;
      font-weight: bold;
      border: none;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      opacity: 0.9;
    }

    .table-container {
      margin-top: 30px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid var(--border-color);
      padding: 8px;
      text-align: left;
    }

    th {
      background-color: var(--accent-color);
      color: #ffffff;
    }

    footer {
      margin-top: 30px;
      text-align: center;
      font-size: 0.8em;
      color: #888;
    }
  </style>

  <!-- SDK de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="container">
    <h1>Control Planillas Adicionales</h1>

    <form id="registroForm">
      <div>
        <label for="fecha">Fecha:</label>
        <input type="date" id="fecha" required>
      </div>

      <div>
        <label for="personal">Personal / Objetivo:</label>
        <input type="text" id="personal" placeholder="Ingrese detalle" required>
      </div>

      <div>
        <label for="movil">Móvil / Vehículo:</label>
        <input type="text" id="movil" placeholder="Ingrese móvil">
      </div>

      <div>
        <label for="grupo">Grupo:</label>
        <select id="grupo">
          <option value="General">General</option>
          <option value="Amigos de Angie">Amigos de Angie</option>
          <option value="Amigos Sra Amalia">Amigos Sra Amalia</option>
        </select>
      </div>

      <button type="submit">Guardar Registro</button>
    </form>

    <div class="table-container">
      <h2>Registros Guardados</h2>
      <table>
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Personal</th>
            <th>Móvil</th>
            <th>Grupo</th>
          </tr>
        </thead>
        <tbody id="tablaCuerpo">
          <!-- Datos cargados dinámicamente -->
        </tbody>
      </table>
    </div>
  </div>

  <footer>
    Powered by GabyMartin
  </footer>

  <script>
    // Configuración de Supabase (reemplazar con tus credenciales si corresponden)
    const SUPABASE_URL = 'https://TU_SUPABASE_URL.supabase.co';
    const SUPABASE_KEY = 'TU_SUPABASE_ANON_KEY';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const form = document.getElementById('registroForm');
    const tablaCuerpo = document.getElementById('tablaCuerpo');

    // Cargar datos al iniciar
    document.addEventListener('DOMContentLoaded', cargarDatos);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const nuevoRegistro = {
        fecha: document.getElementById('fecha').value,
        personal: document.getElementById('personal').value,
        movil: document.getElementById('movil').value,
        grupo: document.getElementById('grupo').value
      };

      const { data, error } = await supabase
        .from('planillas')
        .insert([nuevoRegistro]);

      if (error) {
        console.error('Error al guardar:', error);
        alert('Error al guardar el registro');
      } else {
        form.reset();
        cargarDatos();
      }
    });

    async function cargarDatos() {
      const { data, error } = await supabase
        .from('planillas')
        .select('*')
        .order('fecha', { ascending: false });

      if (error) {
        console.error('Error al obtener datos:', error);
        return;
      }

      tablaCuerpo.innerHTML = '';
      data.forEach(item => {
        const fila = document.createElement('tr');
        fila.innerHTML = `
          <td>${item.fecha || ''}</td>
          <td>${item.personal || ''}</td>
          <td>${item.movil || ''}</td>
          <td>${item.grupo || ''}</td>
        `;
        tablaCuerpo.appendChild(fila);
      });
    }
  </script>
</body>
</html>
